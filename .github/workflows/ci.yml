name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests/ -q
  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osokai:${{ github.sha }} .
      - run: docker run --rm -e OSOKAI_AUTH_TOKEN=ci-check osokai:${{ github.sha }} python -c "import app.main; print('import ok')"
