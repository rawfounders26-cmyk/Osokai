services:
  osokai:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - ./backend/.env
    volumes:
      # F10: named volume mounted where the app actually stores state (/data),
      # workspace bind where the app actually reads it (/data/workspace)
      - osokai-data:/data
      - ./backend/workspace:/data/workspace
    restart: unless-stopped

volumes:
  osokai-data:
