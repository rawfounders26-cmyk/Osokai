# Single-tenant cloud brain: backend (private) + Caddy (public HTTPS, auto-TLS).
# The VPS is *your* computer in the cloud — same SQLite brain, same token auth.
services:
  osokai:
    build: .
    expose:
      - "8765"
    env_file:
      - ./backend/.env
    environment:
      OSOKAI_CORS: "https://${DOMAIN:-osokai.example.com}"
    volumes:
      - osokai-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=4)); assert d.get('ok') is True"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: "${DOMAIN:-osokai.example.com}"
    restart: unless-stopped
    depends_on:
      osokai:
        condition: service_healthy

volumes:
  osokai-data:
  caddy-data:
  caddy-config:
